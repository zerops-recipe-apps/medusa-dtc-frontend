# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/zerops-yaml-json-schema.json
#
# Standalone Next.js storefront. Setups are only `dev` and `prod`.
# Vault keys inject as-is. `dev` deploys `./`.

zerops:
  - setup: prod
    build:
      base: nodejs@24
      envVariables:
        MEDUSA_BACKEND_URL: ${API_URL}
        MEDUSA_PUBLISHABLE_KEY: ${CHANNEL_PUBLISHABLE_KEY}
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${API_URL}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${CHANNEL_PUBLISHABLE_KEY}
        NEXT_PUBLIC_BASE_URL: ${APP_URL}
        NEXT_PUBLIC_DEFAULT_REGION: de
        NEXT_PUBLIC_SEARCH_ENDPOINT: ${SEARCH_URL}
        OBJECT_STORAGE_API_URL: ${RUNTIME_OBJECT_STORAGE_API_URL}
      prepareCommands:
        - corepack enable
      buildCommands:
        - yarn
        - yarn build
      deployFiles:
        - .next
        - package.json
        - next.config.js
        - yarn.lock
        - .yarnrc.yml
        - node_modules
        - public
        - check-env-variables.js
      cache:
        - node_modules
    deploy:
      readinessCheck:
        httpGet:
          port: 8000
          path: /api/health
    run:
      base: nodejs@24
      healthCheck:
        httpGet:
          port: 8000
          path: /api/health
      ports:
        - port: 8000
          httpSupport: true
      envVariables:
        MEDUSA_BACKEND_URL: http://${MEDUSA_HOST}:9000
        MEDUSA_PUBLISHABLE_KEY: ${CHANNEL_PUBLISHABLE_KEY}
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${API_URL}
        NEXT_PUBLIC_BASE_URL: ${APP_URL}
        NEXT_PUBLIC_DEFAULT_REGION: de
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${CHANNEL_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SEARCH_ENDPOINT: ${SEARCH_URL}
        OBJECT_STORAGE_API_URL: ${storage_apiUrl}

  - setup: dev
    build:
      base: nodejs@24
      envVariables:
        MEDUSA_BACKEND_URL: ${API_URL}
        MEDUSA_PUBLISHABLE_KEY: ${CHANNEL_PUBLISHABLE_KEY}
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${API_URL}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${CHANNEL_PUBLISHABLE_KEY}
        NEXT_PUBLIC_BASE_URL: ${DEV_APP_URL}
        NEXT_PUBLIC_DEFAULT_REGION: de
        NEXT_PUBLIC_SEARCH_ENDPOINT: ${SEARCH_URL}
        OBJECT_STORAGE_API_URL: ${RUNTIME_OBJECT_STORAGE_API_URL}
      prepareCommands:
        - corepack enable
      buildCommands:
        - yarn
      deployFiles: ./
      cache:
        - node_modules
    run:
      base: nodejs@24
      ports:
        - port: 8000
          httpSupport: true
      envVariables:
        MEDUSA_BACKEND_URL: http://${MEDUSA_HOST}:9000
        MEDUSA_PUBLISHABLE_KEY: ${CHANNEL_PUBLISHABLE_KEY}
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${API_URL}
        NEXT_PUBLIC_BASE_URL: ${DEV_APP_URL}
        NEXT_PUBLIC_DEFAULT_REGION: de
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${CHANNEL_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SEARCH_ENDPOINT: ${SEARCH_URL}
        OBJECT_STORAGE_API_URL: ${storage_apiUrl}
